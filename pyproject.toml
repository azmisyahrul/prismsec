[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismsec"
version = "0.1.0"
description = "MCP security/pentesting tools server — async subprocess execution with structured JSON output"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "mcp-recon contributors" },
]
keywords = ["mcp", "security", "pentesting", "recon", "nmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mcp-recon = "mcp_recon.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_recon"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
